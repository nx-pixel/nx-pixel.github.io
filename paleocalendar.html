<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌍 Палеокалендарь — история Земли</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0f1a24;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e8f0f8;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: linear-gradient(145deg, #1a2c3b, #0f1e2b);
            border-radius: 48px;
            padding: 32px 28px 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.06);
            border: 1px solid #2e4b5e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d6e8f5;
        }
        .header h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #7fa3bb;
            margin-left: 6px;
        }
        .today-badge {
            background: #1f3a4a;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #2f566b;
            color: #b3d6ec;
            letter-spacing: 0.3px;
        }
        .date-display {
            background: #0f1e2b;
            border-radius: 32px;
            padding: 20px 22px 18px;
            margin-bottom: 18px;
            border: 1px solid #263f50;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.5);
            text-align: center;
        }
        .date-display .day-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #7fa3bb;
        }
        .date-display .paleo-date {
            font-size: 2.6rem;
            font-weight: 500;
            margin: 6px 0 2px;
            color: #f0f9ff;
            letter-spacing: -0.5px;
        }
        .date-display .event-name {
            font-size: 1.7rem;
            font-weight: 400;
            color: #f7d44a;
            margin-top: 4px;
            letter-spacing: -0.3px;
        }
        .date-display .time-range {
            font-size: 0.95rem;
            color: #8fb4cc;
            margin-top: 8px;
        }
        .date-display .climate {
            font-size: 1.2rem;
            margin: 4px 0 6px;
        }
        .detail-box {
            background: #13232f;
            border-radius: 24px;
            padding: 18px 22px;
            margin: 12px 0 16px;
            border-left: 4px solid #f7c948;
            color: #c7ddee;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .detail-box strong { color: #f5e07a; }
        .progress-section {
            margin: 18px 0 14px;
            background: #0d1a24;
            padding: 12px 16px 16px;
            border-radius: 60px;
            border: 1px solid #2a4356;
        }
        .progress-bar {
            height: 10px;
            background: #1d3342;
            border-radius: 40px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3f7b9c, #f7c948, #e68a2e);
            border-radius: 40px;
            transition: width 0.2s ease;
        }
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #6e93ab;
            margin-top: 6px;
            padding: 0 4px;
        }
        .nav-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
            align-items: center;
            justify-content: center;
        }
        .nav-controls button {
            background: #1f3a4a;
            border: none;
            color: #d6e8f5;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #2f566b;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .nav-controls button:hover {
            background: #2a4d62;
            transform: scale(0.97);
        }
        .nav-controls .date-picker-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0d1a24;
            padding: 4px 6px 4px 16px;
            border-radius: 60px;
            border: 1px solid #2a4356;
            flex: 2 1 220px;
        }
        .nav-controls input[type="date"] {
            background: transparent;
            border: none;
            color: #d6e8f5;
            font-size: 0.95rem;
            padding: 8px 4px;
            width: 100%;
            outline: none;
            font-family: inherit;
        }
        .nav-controls input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }
        .nav-controls .btn-icon {
            background: #1f3a4a;
            border: none;
            color: #d6e8f5;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            border: 1px solid #2f566b;
            transition: 0.1s;
        }
        .nav-controls .btn-icon:hover { background: #2a4d62; }
        .footnote {
            margin-top: 22px;
            font-size: 0.8rem;
            color: #5e8099;
            text-align: center;
            border-top: 1px dashed #1f3a4a;
            padding-top: 18px;
            letter-spacing: 0.2px;
        }
        .footnote span { color: #b3d6ec; }
        .era-tag {
            display: inline-block;
            background: #1a3342;
            padding: 2px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            color: #b3d6ec;
            border: 1px solid #2f566b;
            margin-top: 6px;
        }
        @media (max-width: 500px) {
            .card { padding: 20px 16px; }
            .date-display .paleo-date { font-size: 2.0rem; }
            .date-display .event-name { font-size: 1.3rem; }
            .nav-controls { flex-direction: column; }
            .nav-controls .date-picker-wrap { width: 100%; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <div class="header">
        <h1>🌍 Палеокалендарь <small>история Земли</small></h1>
        <div class="today-badge" id="todayBadge">📅 сегодня</div>
    </div>

    <div class="date-display">
        <div class="day-label" id="dayLabel">СЕГОДНЯ</div>
        <div class="paleo-date" id="paleoDate">1-е Криогения</div>
        <div class="event-name" id="eventName">❄️ День Земли-снежка</div>
        <div class="climate" id="climateIcon">🌍</div>
        <div class="time-range" id="timeRange">~720—714 млн лет назад</div>
        <div class="era-tag" id="eraTag">Протерозой</div>
    </div>

    <div class="detail-box" id="detailBox">
        <strong>📖 Факт:</strong> <span id="factText">Начало палеокалендаря. Земля — ледяной шар.</span>
    </div>

    <div class="progress-section">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-labels">
            <span>🪨 Протерозой</span>
            <span>🌿 Палеозой</span>
            <span>🦕 Мезозой</span>
            <span>🐘 Кайнозой</span>
        </div>
    </div>

    <div class="nav-controls">
        <button id="prevDayBtn">◀ Назад</button>
        <div class="date-picker-wrap">
            <input type="date" id="datePicker" />
            <button class="btn-icon" id="goDateBtn">📅</button>
        </div>
        <button id="nextDayBtn">Вперёд ▶</button>
        <button id="randomBtn" style="flex:0.5;">🎲</button>
        <button id="todayBtn" style="flex:0.5;">↺ Сегодня</button>
    </div>

    <div class="footnote">
        <span>Каждый день — событие в истории Земли</span> · 1 день ≈ 1,48 млн лет
    </div>
</div>

<script>
    (function() {
        // ================================================================
        //  ПОЛНЫЙ МАССИВ ДАННЫХ (366 дней)
        //  Формат: [paleoDate, eventName, era, timeRange, fact, climate]
        //  ВСЕ НАЗВАНИЯ УНИКАЛЬНЫ
        // ================================================================
        const DAYS = [];

        function addDay(paleoDate, eventName, era, timeRange, fact, climate = '🌍') {
            DAYS.push({ paleoDate, eventName, era, timeRange, fact, climate });
        }

        // ================================================================
        // 1. ПРОТЕРОЗОЙ — КРИОГЕНИЙ (1–15 января)
        // ================================================================
        const криогений = [
            ['1-е Криогения', '❄️ День Земли-снежок', '~720—714 млн лет назад', 'Начало палеокалендаря. Земля — ледяной шар, жизнь теплится в океанах.'],
            ['2-е Криогения', '❄️ День ледяного безмолвия', '~714—708 млн лет назад', 'Планета скована льдом, лишь ветер над белой пустыней.'],
            ['3-е Криогения', '❄️ День подлёдного океана', '~708—703 млн лет назад', 'Под толщей льда кипит жизнь у гидротермальных источников.'],
            ['4-е Криогения', '❄️ День замерзшего экватора', '~703—697 млн лет назад', 'Лёд доходит до экватора — первое глобальное оледенение.'],
            ['5-е Криогения', '❄️ День ледяного щита', '~697—691 млн лет назад', 'Толщина льда достигает нескольких километров.'],
            ['6-е Криогения', '❄️ День белого безмолвия', '~691—686 млн лет назад', 'Планета безмолвна, только ветер над льдами.'],
            ['7-е Криогения', '❄️ День скрытой жизни', '~686—680 млн лет назад', 'Микроорганизмы выживают в капельках жидкой воды.'],
            ['8-е Криогения', '❄️ День долгой зимы', '~680—674 млн лет назад', 'Ледниковый период длится миллионы лет.'],
            ['9-е Криогения', '❄️ День ледяных ветров', '~674—669 млн лет назад', 'Ветры разгоняют снег, образуя ледяные дюны.'],
            ['10-е Криогения', '❄️ День замерзших морей', '~669—663 млн лет назад', 'Океаны скованы льдом, только у гидротерм — жизнь.'],
            ['11-е Криогения', '❄️ День ледяных гор', '~663—657 млн лет назад', 'Ледяные горы возвышаются над равнинами.'],
            ['12-е Криогения', '❄️ День белого солнца', '~657—651 млн лет назад', 'Солнце в ледяной дымке — бледный диск.'],
            ['13-е Криогения', '❄️ День замерзшего времени', '~651—646 млн лет назад', 'Время застыло, планета в спячке.'],
            ['14-е Криогения', '❄️ День ледяных кристаллов', '~646—640 млн лет назад', 'Снег превращается в плотный лёд.'],
            ['15-е Криогения', '❄️ День таяния льдов', '~640—635 млн лет назад', 'Ледник начинает таять — эпоха меняется.']
        ];
        криогений.forEach(([date, event, time, fact]) => addDay(date, event, 'Протерозой', time, fact, '❄️'));

        // ================================================================
        // 2. ПРОТЕРОЗОЙ — ЭДИАКАРИЙ (16–30 января)
        // ================================================================
        const эдиакарий = [
            ['1-е Эдиакария', '🌊 День первых медуз', '~635—629 млн лет назад', 'Первые мягкотелые организмы — медузы и странные диски.'],
            ['2-е Эдиакария', '🌊 День дикинсонии', '~629—623 млн лет назад', 'Загадочное существо — дикинсония на дне океана.'],
            ['3-е Эдиакария', '🌊 День чарнии', '~623—616 млн лет назад', 'Первое животное с двусторонней симметрией.'],
            ['4-е Эдиакария', '🌊 День спрингины', '~616—610 млн лет назад', 'Первый известный хищник — спрингина.'],
            ['5-е Эдиакария', '🌊 День кимбереллы', '~610—604 млн лет назад', 'Моллюскоподобное существо на дне.'],
            ['6-е Эдиакария', '🌊 День эдиакарского леса', '~604—597 млн лет назад', 'Лес из мягкотелых организмов на дне.'],
            ['7-е Эдиакария', '🌊 День первых кишечнополостных', '~597—591 млн лет назад', 'Предки медуз и кораллов.'],
            ['8-е Эдиакария', '🌊 День эдиакарских садов', '~591—585 млн лет назад', 'Мягкотелые организмы покрывают дно океана.'],
            ['9-е Эдиакария', '🌊 День первых следов', '~585—578 млн лет назад', 'Следы ползания на морском дне.'],
            ['10-е Эдиакария', '🌊 День параванкорины', '~578—572 млн лет назад', 'Животное с сегментированным телом.'],
            ['11-е Эдиакария', '🌊 День эдиакарских холмов', '~572—566 млн лет назад', 'Холмики на дне — следы жизни.'],
            ['12-е Эдиакария', '🌊 День перьевых форм', '~566—559 млн лет назад', 'Организмы, похожие на перья, в воде.'],
            ['13-е Эдиакария', '🌊 День эдиакарского мира', '~559—553 млн лет назад', 'Эдиакарская биота в расцвете.'],
            ['14-е Эдиакария', '🌊 День мягкотелых гигантов', '~553—547 млн лет назад', 'Крупные мягкотелые организмы на дне.'],
            ['15-е Эдиакария', '🌊 День конца Эдиакария', '~547—541 млн лет назад', 'Мягкотелые формы уступают место скелетным.']
        ];
        эдиакарий.forEach(([date, event, time, fact]) => addDay(date, event, 'Протерозой', time, fact, '🌊'));

        // ================================================================
        // 3. ПАЛЕОЗОЙ — КЕМБРИЙ (31 января – 19 февраля)
        // ================================================================
        const кембрий = [
            ['1-е Кембрия', '🦐 День кембрийского взрыва', '~541—538 млн лет назад', 'Внезапное появление всех типов животных.'],
            ['2-е Кембрия', '🦐 День трилобитов', '~538—535 млн лет назад', 'Трилобиты — первые существа с экзоскелетом.'],
            ['3-е Кембрия', '🦐 День первых глаз', '~535—533 млн лет назад', 'Появление глаз — эволюционный прорыв.'],
            ['4-е Кембрия', '🦐 День аномалокариса', '~533—530 млн лет назад', 'Гигантский хищник с глазами-стебельками.'],
            ['5-е Кембрия', '🦐 День первых челюстей', '~530—527 млн лет назад', 'Появление челюстей у рыб.'],
            ['6-е Кембрия', '🦐 День опибинии', '~527—524 млн лет назад', 'Пятиглазый хищник кембрия.'],
            ['7-е Кембрия', '🦐 День галлюцигении', '~524—521 млн лет назад', 'Странное существо с шипами.'],
            ['8-е Кембрия', '🦐 День виваксии', '~521—518 млн лет назад', 'Существо с шипами и панцирем.'],
            ['9-е Кембрия', '🦐 День пикайи', '~518—515 млн лет назад', 'Древнейший хордовый — предок позвоночных.'],
            ['10-е Кембрия', '🦐 День морских лилий', '~515—512 млн лет назад', 'Криноидеи — цветы моря.'],
            ['11-е Кембрия', '🦐 День брахиопод', '~512—509 млн лет назад', 'Ракушечные организмы покрывают дно.'],
            ['12-е Кембрия', '🦐 День морских огурцов', '~509—506 млн лет назад', 'Голотурии — морские огурцы.'],
            ['13-е Кембрия', '🦐 День хордовых', '~506—503 млн лет назад', 'Появление хорды — предок позвоночных.'],
            ['14-е Кембрия', '🦐 День щетинкочелюстных', '~503—500 млн лет назад', 'Первые щетинкочелюстные — мелкие хищники.'],
            ['15-е Кембрия', '🦐 День ракоскорпионов', '~500—497 млн лет назад', 'Первые ракоскорпионы — гигантские хищники.'],
            ['16-е Кембрия', '🦐 День гигантских трилобитов', '~497—494 млн лет назад', 'Трилобиты достигают больших размеров.'],
            ['17-е Кембрия', '🦐 День первых моллюсков', '~494—491 млн лет назад', 'Моллюски — новая эра.'],
            ['18-е Кембрия', '🦐 День кембрийских водорослей', '~491—488 млн лет назад', 'Водоросли покрывают дно океана.'],
            ['19-е Кембрия', '🦐 День кембрийских хищников', '~488—486 млн лет назад', 'Появление первых крупных хищников.'],
            ['20-е Кембрия', '🦐 День конца Кембрия', '~486—485 млн лет назад', 'Кембрий завершается, начинается ордовик.']
        ];
        кембрий.forEach(([date, event, time, fact]) => addDay(date, event, 'Палеозой', time, fact, '🐚'));

        // ================================================================
        // 4. ПАЛЕОЗОЙ — ОРДОВИК (20 февраля – 11 марта)
        // ================================================================
        const ордовик = [
            ['1-е Ордовика', '🐟 День первых рыб', '~485—483 млн лет назад', 'Появление первых позвоночных — бесчелюстных рыб.'],
            ['2-е Ордовика', '🐟 День граптолитов', '~483—481 млн лет назад', 'Колониальные организмы в океане.'],
            ['3-е Ордовика', '🐟 День морских скорпионов', '~481—479 млн лет назад', 'Ракоскорпионы — гигантские хищники.'],
            ['4-е Ордовика', '🐟 День первых кораллов', '~479—477 млн лет назад', 'Появление рифостроящих кораллов.'],
            ['5-е Ордовика', '🐟 День головоногих', '~477—475 млн лет назад', 'Наутилусы с прямыми раковинами.'],
            ['6-е Ордовика', '🐟 День трилобитов-гигантов', '~475—473 млн лет назад', 'Трилобиты достигают огромных размеров.'],
            ['7-е Ордовика', '🐟 День морских лилий', '~473—471 млн лет назад', 'Морские лилии покрывают дно.'],
            ['8-е Ордовика', '🐟 День мшанок', '~471—469 млн лет назад', 'Колониальные мшанки.'],
            ['9-е Ордовика', '🐟 День плащеносных рыб', '~469—467 млн лет назад', 'Первая рыба с плавниками.'],
            ['10-е Ордовика', '🐟 День ордовикских рифов', '~467—465 млн лет назад', 'Рифы растут на дне океана.'],
            ['11-е Ордовика', '🐟 День хищных рыб', '~465—463 млн лет назад', 'Рыбы становятся хищниками.'],
            ['12-е Ордовика', '🐟 День гигантских головоногих', '~463—461 млн лет назад', 'Головоногие моллюски до 6 метров.'],
            ['13-е Ордовика', '🐟 День морских ежей', '~461—459 млн лет назад', 'Морские ежи появляются.'],
            ['14-е Ордовика', '🐟 День морских звёзд', '~459—457 млн лет назад', 'Морские звёзды — новые хищники.'],
            ['15-е Ордовика', '🐟 День ордовикских лесов', '~457—455 млн лет назад', 'Лес из морских организмов.'],

        // ================================================================
        // 17. КАЙНОЗОЙ — ПЛЕЙСТОЦЕН (15–31 декабря)
        // ================================================================
        const плейстоцен = [
            ['1-е Плейстоцена', '🧊 День ледникового периода', '~2.60—2.45 млн лет назад', 'Мамонты, саблезубые тигры, пещерные люди.'],
            ['2-е Плейстоцена', '🧊 День мамонтов', '~2.45—2.30 млн лет назад', 'Мамонты — гиганты ледникового периода.'],

            ['4-е Плейстоцена', '🧊 День пещерных людей', '~2.15—2.00 млн лет назад', 'Неандертальцы — первые люди в пещерах.'],
            ['5-е Плейстоцена', '🧊 День шерстистых носорогов', '~2.00—1.85 млн лет назад', 'Шерстистые носороги — гиганты ледникового периода.'],
            ['6-е Плейстоцена', '🧊 День плейстоценовых оленей', '~1.85—1.70 млн лет назад', 'Олени — травоядные ледникового периода.'],
            ['7-е Плейстоцена', '🧊 День плейстоценовых бизонов', '~1.70—1.55 млн лет назад', 'Бизоны — стадные животные.'],
            ['8-е Плейстоцена', '🧊 День плейстоценовых медведей', '~1.55—1.40 млн лет назад', 'Пещерные медведи — крупные хищники.'],

            ['14-е Плейстоцена', '🧊 День плейстоценовых гиен', '~0.65—0.50 млн лет назад', 'Пещерные гиены — падальщики.'],
            ['15-е Плейстоцена', '🧊 День вымирания мегафауны', '~0.50—0.35 млн лет назад', 'Мамонты и саблезубые вымирают.'],

            ['17-е Плейстоцена', '🧑 День человека разумного', '~0.20—0.012 млн лет назад', 'Homo sapiens расселяется по планете, создаёт искусство, строит города. Начинается наша эра.']
        ];
        плейстоцен.forEach(([date, event, time, fact]) => addDay(date, event, 'Кайнозой', time, fact, '🧊'));

        // ================================================================
        // 366-Й ДЕНЬ: 29 ФЕВРАЛЯ
        // ================================================================
        DAYS.push({
            paleoDate: 'День високосного года',
            eventName: '⏳ День дополнительного времени',
            era: 'Вне времени',
            timeRange: '—',
            fact: 'Каждые 4 года Земля дарит нам лишний день. Он не принадлежит ни одной эпохе — это подарок Вселенной. Используйте его для того, что всегда откладывали. Сегодня время остановилось — только для вас.',
            climate: '⏳'
        });

        // ================================================================
        //  ПРИЛОЖЕНИЕ
        // ================================================================
        let currentDayIndex = 0;

        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 1);
            const diff = date - start;
            const day = Math.floor(diff / 86400000) + 1;
            if (date.getMonth() === 1 && date.getDate() === 29) return 366;
            return day;
        }

        const today = new Date();
        let dayOfYear = getDayOfYear(today);
        if (dayOfYear < 1) dayOfYear = 1;
        if (dayOfYear > 366) dayOfYear = 366;
        currentDayIndex = dayOfYear - 1;

        const dayLabel = document.getElementById('dayLabel');
        const paleoDate = document.getElementById('paleoDate');
        const eventName = document.getElementById('eventName');
        const climateIcon = document.getElementById('climateIcon');
        const timeRange = document.getElementById('timeRange');
        const eraTag = document.getElementById('eraTag');
        const factText = document.getElementById('factText');
        const progressFill = document.getElementById('progressFill');
        const datePicker = document.getElementById('datePicker');
        const todayBadge = document.getElementById('todayBadge');

        function updateDisplay(index) {
            const data = DAYS[index];
            if (!data) return;

            const dayNum = index + 1;
            const dateObj = new Date(2026, 0, 1);
            dateObj.setDate(dayNum);
            const dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

            dayLabel.textContent = dateStr.toUpperCase();
            paleoDate.textContent = data.paleoDate;
            eventName.textContent = data.eventName;
            climateIcon.textContent = data.climate || '🌍';
            timeRange.textContent = data.timeRange || '';
            eraTag.textContent = data.era || '';
            factText.textContent = data.fact || '';

            const progress = (index / (DAYS.length - 1)) * 100;
            progressFill.style.width = progress + '%';

            const now = new Date();
            const nowDay = getDayOfYear(now);
            if (index === nowDay - 1) {
                todayBadge.textContent = '📅 сегодня';
                todayBadge.style.background = '#1f3a4a';
            } else {
                todayBadge.textContent = `📅 день ${dayNum}`;
                todayBadge.style.background = '#0f1e2b';
            }

            const pickerDate = new Date(2026, 0, 1);
            pickerDate.setDate(dayNum);
            const year = pickerDate.getFullYear();
            const month = String(pickerDate.getMonth() + 1).padStart(2, '0');
            const day = String(pickerDate.getDate()).padStart(2, '0');
            datePicker.value = `${year}-${month}-${day}`;
        }

        function goToDate(dateObj) {
            const dayNum = getDayOfYear(dateObj);
            if (dayNum >= 1 && dayNum <= 366) {
                currentDayIndex = dayNum - 1;
                updateDisplay(currentDayIndex);
            }
        }

        document.getElementById('prevDayBtn').addEventListener('click', function() {
            if (currentDayIndex > 0) { currentDayIndex--; updateDisplay(currentDayIndex); }
        });
        document.getElementById('nextDayBtn').addEventListener('click', function() {
            if (currentDayIndex < DAYS.length - 1) { currentDayIndex++; updateDisplay(currentDayIndex); }
        });
        document.getElementById('todayBtn').addEventListener('click', function() {
            const now = new Date();
            const dayNum = getDayOfYear(now);
            currentDayIndex = Math.max(0, Math.min(DAYS.length - 1, dayNum - 1));
            updateDisplay(currentDayIndex);
        });
        document.getElementById('randomBtn').addEventListener('click', function() {
            currentDayIndex = Math.floor(Math.random() * DAYS.length);
            updateDisplay(currentDayIndex);
        });
        document.getElementById('goDateBtn').addEventListener('click', function() {
            const val = datePicker.value;
            if (!val) return;
            const parts = val.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            if (!isNaN(d.getTime())) goToDate(d);
        });
        datePicker.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('goDateBtn').click();
        });

        updateDisplay(currentDayIndex);
    })();
</script>
