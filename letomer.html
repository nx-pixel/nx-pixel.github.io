<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Измеритель состояния лета</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #dae3f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 36px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }
        h1 {
            font-weight: 500;
            font-size: 2.1rem;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
            color: #1a2b3c;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #3e5a70;
            margin-left: auto;
            background: rgba(0,0,0,0.03);
            padding: 4px 14px;
            border-radius: 40px;
        }
        .sub {
            color: #2c4055;
            margin-top: -6px;
            margin-bottom: 28px;
            font-weight: 350;
            border-left: 3px solid #f9b84a;
            padding-left: 14px;
        }
        .meter {
            background: #eaf0f8;
            border-radius: 120px;
            height: 28px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.08);
            margin: 16px 0 20px 0;
            overflow: hidden;
            position: relative;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fdcb6e, #f9a825, #f57c00);
            border-radius: 120px;
            transition: width 0.2s ease-out;
            box-shadow: 0 0 12px #f9a82566;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            color: #1e2a36;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            min-width: 0;
        }
        .value-label {
            font-size: 3.2rem;
            font-weight: 500;
            letter-spacing: -1px;
            color: #0b1a2a;
            line-height: 1.1;
            margin: 8px 0 4px 0;
        }
        .value-label span {
            font-size: 1.3rem;
            font-weight: 400;
            color: #34506b;
            margin-left: 6px;
        }
        .date-info {
            background: #dce6f2;
            padding: 10px 18px;
            border-radius: 60px;
            display: inline-block;
            font-size: 1rem;
            font-weight: 500;
            color: #1f3449;
            margin: 12px 0 10px 0;
            letter-spacing: 0.3px;
        }
        .speed-info {
            background: #fff4e0;
            border: 1px solid #f9d79a;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 500;
            color: #6b4a12;
            margin: 0 0 22px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
        }
        .speed-info .arrow {
            font-size: 1.3rem;
            line-height: 1;
        }
        .speed-info.rising {
            background: #e8f7e5;
            border-color: #b5e0a8;
            color: #2d5c22;
        }
        .speed-info.falling {
            background: #fdecea;
            border-color: #f5b7b1;
            color: #7a2a22;
        }
        .speed-info.peak {
            background: #e8eefc;
            border-color: #b8c8f0;
            color: #263c7a;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 10px;
            margin: 28px 0 12px 0;
            background: #edf4fd;
            padding: 18px 20px;
            border-radius: 60px;
            align-items: center;
        }
        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 450;
            color: #1c3146;
            cursor: pointer;
            background: rgba(255,255,255,0.4);
            padding: 6px 18px 6px 14px;
            border-radius: 40px;
            transition: 0.1s;
        }
        .controls label input[type="radio"] {
            accent-color: #f9a825;
            width: 18px;
            height: 18px;
            margin: 0;
        }
        .controls label:hover {
            background: rgba(255, 215, 140, 0.3);
        }
        .date-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .date-picker input[type="date"] {
            border: 1px solid #b7ccdf;
            background: white;
            padding: 10px 12px;
            border-radius: 40px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
            color: #0a1a2b;
            font-weight: 450;
        }
        .date-picker input[type="date"]:focus {
            border-color: #f9a825;
            box-shadow: 0 0 0 3px #f9a82555;
        }
        .btn {
            background: #1f3449;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            letter-spacing: 0.3px;
            border: 1px solid #2b4057;
        }
        .btn:hover {
            background: #2c455f;
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-secondary {
            background: #d6e2f2;
            color: #1a2d42;
            border: 1px solid #b7cbdf;
        }
        .btn-secondary:hover {
            background: #c2d3e8;
        }
        .footnote {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #3a5772;
            border-top: 1px dashed #b4cbdf;
            padding-top: 18px;
            text-align: center;
        }
        .footnote strong {
            color: #1d3a55;
        }
        .forecast {
            margin-top: 22px;
            background: #f7faff;
            border: 1px solid #d7e4f2;
            border-radius: 28px;
            padding: 16px 20px;
        }
        .forecast h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #1a2d42;
            margin: 0 0 10px 0;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .forecast-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 220px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        .forecast-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 14px;
            color: #22384f;
        }
        .forecast-list li:nth-child(odd) {
            background: rgba(255, 255, 255, 0.7);
        }
        .forecast-list li.today {
            background: #ffe9b8;
            font-weight: 600;
            color: #4d3606;
        }
        .forecast-list .fl-date {
            font-variant-numeric: tabular-nums;
            min-width: 92px;
        }
        .forecast-list .fl-level {
            font-variant-numeric: tabular-nums;
            color: #566f88;
            min-width: 52px;
            text-align: right;
        }
        .forecast-list .fl-speed {
            font-variant-numeric: tabular-nums;
            min-width: 130px;
            text-align: right;
            font-weight: 500;
        }
        .forecast-list .fl-speed.rising { color: #2d7a22; }
        .forecast-list .fl-speed.falling { color: #b13a2c; }
        .forecast-list .fl-speed.peak { color: #263c7a; }
        .forecast-list .fl-tag {
            font-size: 0.78rem;
            padding: 1px 8px;
            border-radius: 20px;
            background: #e5eefb;
            color: #3a5772;
            white-space: nowrap;
        }
        .mode-indicator {
            font-size: 0.9rem;
            background: #f0f6fe;
            padding: 6px 18px;
            border-radius: 30px;
            display: inline-block;
        }
        @media (max-width: 480px) {
            .card { padding: 28px 16px; }
            .controls { flex-direction: column; align-items: stretch; }
            .date-picker { margin-left: 0; }
            .forecast-list .fl-speed { min-width: 100px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        ☀️ Летомер
        <small>синус + производная</small>
    </h1>
    <div class="sub">состояние лета · 15.07 = 100% · 15.01 = 0%</div>

    <!-- Индикатор -->
    <div class="meter">
        <div class="meter-fill" id="meterFill" style="width:0%;">0%</div>
    </div>
    <div class="value-label" id="valueLabel">0<span>%</span></div>

    <div class="date-info" id="dateInfo">📅 сегодня</div>

    <!-- Скорость изменения -->
    <div class="speed-info" id="speedInfo">
        <span class="arrow" id="speedArrow">→</span>
        <span id="speedText">…</span>
    </div>

    <!-- Режимы -->
    <div class="controls">
        <label>
            <input type="radio" name="mode" value="today" checked /> 📆 Сегодня
        </label>
        <label>
            <input type="radio" name="mode" value="custom" /> ✏️ Дата
        </label>

        <div class="date-picker">
            <input type="date" id="customDate" value="2026-07-15" />
            <button class="btn" id="applyDateBtn">Показать</button>
            <button class="btn btn-secondary" id="resetTodayBtn">↺ Сегодня</button>
        </div>
    </div>

    <!-- Прогноз на 14 дней -->
    <div class="forecast">
        <h2>📈 Динамика лета на 14 дней</h2>
        <ul class="forecast-list" id="forecastList"></ul>
    </div>

    <div class="footnote">
        <strong>Как работает:</strong> лето измеряется по синусоиде с пиком 15 июля (100%) и минимумом 15 января (0%).
        Производная показывает скорость изменения в %/сутки.
    </div>
</div>

<script>
    (function() {
        // ---------- ЯДРО: вычисление уровня лета (синусоида) ----------
        // level(day) = (1 - cos(2π * (day - 15) / 365)) / 2
        // где day — день года (1 января = 1, 15 января = 15)
        //
        // Производная по дню:
        //   d/d(day) level = (2π / 365) * sin(2π * (day - 15) / 365) / 2
        //                  = (π / 365) * sin(2π * (day - 15) / 365)
        //
        // Знак производной:
        //   > 0 — лето возрастает
        //   < 0 — лето убывает
        //   ≈ 0 — пик (15 июля) или минимум (15 января)
        //
        // Величина производной в %/сутки = производная * 100.

        const DAYS_IN_YEAR = 365;
        const OFFSET = 15; // 15 января — минимум

        function getDayOfYear(dateObj) {
            const d = new Date(dateObj);
            const start = new Date(d.getFullYear(), 0, 0);
            const diff = d - start;
            const oneDay = 86400000;
            return Math.floor(diff / oneDay); // 1..365
        }

        function getSummerLevel(dateObj) {
            const dayOfYear = getDayOfYear(dateObj);
            const rad = (2 * Math.PI * (dayOfYear - OFFSET)) / DAYS_IN_YEAR;
            let level = (1 - Math.cos(rad)) / 2;
            if (level < 0) level = 0;
            if (level > 1) level = 1;
            return level;
        }

        // Производная в долях единицы на сутки
        function getSummerDerivative(dateObj) {
            const dayOfYear = getDayOfYear(dateObj);
            const rad = (2 * Math.PI * (dayOfYear - OFFSET)) / DAYS_IN_YEAR;
            return (Math.PI / DAYS_IN_YEAR) * Math.sin(rad);
        }

        // Производная в %/сутки
        function getSummerSpeedPercent(dateObj) {
            return getSummerDerivative(dateObj) * 100;
        }

        // Классификация направления
        function getSummerTrend(dateObj) {
            const speed = getSummerSpeedPercent(dateObj);
            const EPS = 0.005; // меньше 0.005 %/сутки считаем нулём
            if (Math.abs(speed) < EPS) {
                const level = getSummerLevel(dateObj);
                if (level > 0.5) return 'peak';   // пик лета
                return 'trough';                   // минимум лета
            }
            return speed > 0 ? 'rising' : 'falling';
        }

        // Человекочитаемое описание скорости
        function formatSpeed(dateObj) {
            const speed = getSummerSpeedPercent(dateObj);
            const trend = getSummerTrend(dateObj);
            const absSpeed = Math.abs(speed).toFixed(2);

            let arrow, text, cls;
            if (trend === 'rising') {
                arrow = '↗️';
                text = `Возрастающее лето (+${absSpeed}%/сутки)`;
                cls = 'rising';
            } else if (trend === 'falling') {
                arrow = '↘️';
                text = `Убывающее лето (−${absSpeed}%/сутки)`;
                cls = 'falling';
            } else if (trend === 'peak') {
                arrow = '⛰️';
                text = `Пик лета (${speed >= 0 ? '+' : '−'}${absSpeed}%/сутки)`;
                cls = 'peak';
            } else {
                arrow = '❄️';
                text = `Минимум лета (${speed >= 0 ? '+' : '−'}${absSpeed}%/сутки)`;
                cls = 'peak';
            }
            return { arrow, text, cls, speed, trend };
        }

        // ---------- Вспомогательные функции ----------
        function formatDate(date) {
            const dd = String(date.getDate()).padStart(2, '0');
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const yyyy = date.getFullYear();
            return `${dd}.${mm}.${yyyy}`;
        }

        function toInputValue(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseInputValue(val) {
            const parts = val.split('-');
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }

        // ---------- UI обновление ----------
        const meterFill = document.getElementById('meterFill');
        const valueLabel = document.getElementById('valueLabel');
        const dateInfo = document.getElementById('dateInfo');
        const speedInfo = document.getElementById('speedInfo');
        const speedArrow = document.getElementById('speedArrow');
        const speedText = document.getElementById('speedText');
        const customDateInput = document.getElementById('customDate');
        const todayRadio = document.querySelector('input[name="mode"][value="today"]');
        const customRadio = document.querySelector('input[name="mode"][value="custom"]');
        const applyBtn = document.getElementById('applyDateBtn');
        const resetBtn = document.getElementById('resetTodayBtn');
        const forecastList = document.getElementById('forecastList');

        let currentMode = 'today';
        let displayDate = new Date();

        function updateDisplay() {
            const level = getSummerLevel(displayDate);
            const percent = Math.round(level * 100);

            meterFill.style.width = percent + '%';
            meterFill.textContent = percent + '%';
            valueLabel.innerHTML = percent + '<span>%</span>';

            const weekdays = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const wd = weekdays[displayDate.getDay()];
            const modeText = (currentMode === 'today') ? '📍 сегодня' : '📌 выбранная дата';
            dateInfo.textContent = `${formatDate(displayDate)} (${wd}) · ${modeText}`;

            // Скорость
            const sp = formatSpeed(displayDate);
            speedArrow.textContent = sp.arrow;
            speedText.textContent = sp.text;
            speedInfo.classList.remove('rising', 'falling', 'peak');
            speedInfo.classList.add(sp.cls);

            if (currentMode === 'custom') {
                customDateInput.value = toInputValue(displayDate);
            }

            renderForecast();
        }

        // Список на 14 дней, начиная с displayDate
        function renderForecast() {
            forecastList.innerHTML = '';
            const base = new Date(displayDate);
            base.setHours(0, 0, 0, 0);

            for (let i = 0; i < 14; i++) {
                const d = new Date(base);
                d.setDate(base.getDate() + i);

                const level = getSummerLevel(d);
                const percent = Math.round(level * 100);
                const sp = formatSpeed(d);

                const li = document.createElement('li');
                if (i === 0) li.classList.add('today');

                const absSpeed = Math.abs(sp.speed).toFixed(2);
                let speedStr;
                if (sp.trend === 'rising') speedStr = `↗ +${absSpeed}%/сут`;
                else if (sp.trend === 'falling') speedStr = `↘ −${absSpeed}%/сут`;
                else if (sp.trend === 'peak') speedStr = `⛰ пик`;
                else speedStr = `❄ минимум`;

                li.innerHTML = `
                    <span class="fl-date">${formatDate(d)}</span>
                    <span class="fl-level">${percent}%</span>
                    <span class="fl-speed ${sp.cls}">${speedStr}</span>
                    <span class="fl-tag">${i === 0 ? 'сейчас' : '+' + i + 'д'}</span>
                `;
                forecastList.appendChild(li);
            }
        }

        function setDisplayDate(dateObj, mode) {
            displayDate = new Date(dateObj);
            displayDate.setHours(0, 0, 0, 0);
            if (mode) {
                currentMode = mode;
                if (mode === 'today') {
                    todayRadio.checked = true;
                } else {
                    customRadio.checked = true;
                }
            }
            updateDisplay();
        }

        // ---------- Обработчики ----------
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'today') {
                    currentMode = 'today';
                    setDisplayDate(new Date(), 'today');
                } else {
                    currentMode = 'custom';
                    const val = customDateInput.value;
                    if (val) {
                        const d = parseInputValue(val);
                        if (!isNaN(d.getTime())) {
                            setDisplayDate(d, 'custom');
                        } else {
                            setDisplayDate(new Date(), 'custom');
                        }
                    } else {
                        setDisplayDate(new Date(), 'custom');
                    }
                }
            });
        });

        applyBtn.addEventListener('click', function() {
            const val = customDateInput.value;
            if (!val) {
                alert('Пожалуйста, выберите дату.');
                return;
            }
            const d = parseInputValue(val);
            if (isNaN(d.getTime())) {
                alert('Некорректная дата');
                return;
            }
            customRadio.checked = true;
            currentMode = 'custom';
            setDisplayDate(d, 'custom');
        });

        resetBtn.addEventListener('click', function() {
            todayRadio.checked = true;
            currentMode = 'today';
            setDisplayDate(new Date(), 'today');
        });

        customDateInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                applyBtn.click();
            }
        });

        // Инициализация
        (function init() {
            const now = new Date();
            todayRadio.checked = true;
            currentMode = 'today';
            displayDate = new Date(now);
            displayDate.setHours(0, 0, 0, 0);
            customDateInput.value = toInputValue(now);
            updateDisplay();
        })();

    })();
</script>
</body>
</html>
