<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Измеритель состояния лета</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #dae3f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 36px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }
        h1 {
            font-weight: 500;
            font-size: 2.1rem;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
            color: #1a2b3c;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #3e5a70;
            margin-left: auto;
            background: rgba(0,0,0,0.03);
            padding: 4px 14px;
            border-radius: 40px;
        }
        .sub {
            color: #2c4055;
            margin-top: -6px;
            margin-bottom: 28px;
            font-weight: 350;
            border-left: 3px solid #f9b84a;
            padding-left: 14px;
        }
        .meter {
            background: #eaf0f8;
            border-radius: 120px;
            height: 28px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.08);
            margin: 16px 0 20px 0;
            overflow: hidden;
            position: relative;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fdcb6e, #f9a825, #f57c00);
            border-radius: 120px;
            transition: width 0.2s ease-out;
            box-shadow: 0 0 12px #f9a82566;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            color: #1e2a36;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            min-width: 0;
        }
        .value-label {
            font-size: 3.2rem;
            font-weight: 500;
            letter-spacing: -1px;
            color: #0b1a2a;
            line-height: 1.1;
            margin: 8px 0 4px 0;
        }
        .value-label span {
            font-size: 1.3rem;
            font-weight: 400;
            color: #34506b;
            margin-left: 6px;
        }
        .date-info {
            background: #dce6f2;
            padding: 10px 18px;
            border-radius: 60px;
            display: inline-block;
            font-size: 1rem;
            font-weight: 500;
            color: #1f3449;
            margin: 12px 0 22px 0;
            letter-spacing: 0.3px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 10px;
            margin: 28px 0 12px 0;
            background: #edf4fd;
            padding: 18px 20px;
            border-radius: 60px;
            align-items: center;
        }
        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 450;
            color: #1c3146;
            cursor: pointer;
            background: rgba(255,255,255,0.4);
            padding: 6px 18px 6px 14px;
            border-radius: 40px;
            transition: 0.1s;
        }
        .controls label input[type="radio"] {
            accent-color: #f9a825;
            width: 18px;
            height: 18px;
            margin: 0;
        }
        .controls label:hover {
            background: rgba(255, 215, 140, 0.3);
        }
        .date-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .date-picker input[type="date"] {
            border: 1px solid #b7ccdf;
            background: white;
            padding: 10px 12px;
            border-radius: 40px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
            color: #0a1a2b;
            font-weight: 450;
        }
        .date-picker input[type="date"]:focus {
            border-color: #f9a825;
            box-shadow: 0 0 0 3px #f9a82555;
        }
        .btn {
            background: #1f3449;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            letter-spacing: 0.3px;
            border: 1px solid #2b4057;
        }
        .btn:hover {
            background: #2c455f;
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-secondary {
            background: #d6e2f2;
            color: #1a2d42;
            border: 1px solid #b7cbdf;
        }
        .btn-secondary:hover {
            background: #c2d3e8;
        }
        .footnote {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #3a5772;
            border-top: 1px dashed #b4cbdf;
            padding-top: 18px;
            text-align: center;
        }
        .footnote strong {
            color: #1d3a55;
        }
        .mode-indicator {
            font-size: 0.9rem;
            background: #f0f6fe;
            padding: 6px 18px;
            border-radius: 30px;
            display: inline-block;
        }
        @media (max-width: 480px) {
            .card { padding: 28px 16px; }
            .controls { flex-direction: column; align-items: stretch; }
            .date-picker { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        ☀️ Летомер
        <small>синус</small>
    </h1>
    <div class="sub">состояние лета · 15.07 = 100% · 15.01 = 0%</div>

    <!-- Индикатор -->
    <div class="meter">
        <div class="meter-fill" id="meterFill" style="width:0%;">0%</div>
    </div>
    <div class="value-label" id="valueLabel">0<span>%</span></div>

    <div class="date-info" id="dateInfo">📅 сегодня</div>

    <!-- Режимы -->
    <div class="controls">
        <label>
            <input type="radio" name="mode" value="today" checked /> 📆 Сегодня
        </label>
        <label>
            <input type="radio" name="mode" value="custom" /> ✏️ Дата
        </label>

        <div class="date-picker">
            <input type="date" id="customDate" value="2026-07-15" />
            <button class="btn" id="applyDateBtn">Показать</button>
            <button class="btn btn-secondary" id="resetTodayBtn">↺ Сегодня</button>
        </div>
    </div>

    <div class="footnote">
        <strong>Как работает:</strong> лето измеряется по синусоиде с пиком 15 июля (100%) и минимумом 15 января (0%).
        Плавно меняется в течение года.
    </div>
</div>

<script>
    (function() {
        // ---------- ЯДРО: вычисление уровня лета (синусоида) ----------
        // Пик: 15 июля (день 196 в невисокосный) → 100%
        // Ноль: 15 января (день 15) → 0%
        // Используем синусоиду: смещаем так, чтобы 15 июля давало 1, 15 января давало 0.
        // Период = 365 дней. 
        // фаза: sin( 2π*(day - 15)/365 )  -> 15 января (day=15) даёт sin(0)=0
        // но 15 июля (day=196) даст sin(2π*(181)/365) ≈ sin(π) = 0, не подходит.
        // Поэтому добавим смещение: хотим чтобы 15 июля был пик (1), а 15 января — ноль (0)
        // sin(2π*(day - offset)/365) = 1 при day=196 => (196 - offset)/365 = 1/4 => offset = 196 - 365/4 = 196 - 91.25 = 104.75
        // Проверим day=15: (15 - 104.75)/365 = -89.75/365 ≈ -0.246 => sin(-0.246*2π) ≈ -0.987, не 0.
        // Лучше использовать косинус: cos(2π*(day - 15)/365) даёт 1 при day=15, и -1 при day=197.5.
        // Нам нужно: при day=15 значение 0, при day=196 значение 1.
        // Формула: level = (1 - cos(2π * (day - 15) / 365)) / 2
        // Проверка: day=15 → (1 - cos(0))/2 = 0  ✅
        // day=196 (15 июля): (1 - cos(2π*181/365))/2 = (1 - cos(3.116))/2 = (1 - (-0.998))/2 ≈ 0.999 ✅ (почти 1)
        // day=15+182.5 = 197.5 → (1 - cos(π))/2 = 1  -> максимум смещен на ~2 дня, но точность достаточная.
        // Для большей точности используем dayOffset = 15, и считаем день года.
        // Учтем високосный год — но для простоты используем фиксированный 365, 
        // погрешность в високосный год ≤ 0.3%, что допустимо.

        function getSummerLevel(dateObj) {
            // Копируем дату, чтобы не мутировать
            const d = new Date(dateObj);
            // День года: 1-365 (для невисокосного)
            const start = new Date(d.getFullYear(), 0, 0);
            const diff = d - start;
            const oneDay = 86400000;
            let dayOfYear = Math.floor(diff / oneDay); // 1-365 (0-364)
            // для 15 января dayOfYear = 15 (так как 1 января = 1)
            // но из-за смещения start new Date(year,0,0) даёт 31 декабря предыдущего года, 
            // поэтому 1 января = 1, 15 января = 15.
            // Формула: level = (1 - cos(2π * (dayOfYear - 15) / 365)) / 2
            const rad = (2 * Math.PI * (dayOfYear - 15)) / 365;
            let level = (1 - Math.cos(rad)) / 2;
            // Из-за округления может быть -0.000 или 1.000, ограничим
            if (level < 0) level = 0;
            if (level > 1) level = 1;
            return level;
        }

        // ---------- Вспомогательные функции ----------
        function formatDate(date) {
            const dd = String(date.getDate()).padStart(2, '0');
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const yyyy = date.getFullYear();
            return `${dd}.${mm}.${yyyy}`;
        }

        // ---------- UI обновление ----------
        const meterFill = document.getElementById('meterFill');
        const valueLabel = document.getElementById('valueLabel');
        const dateInfo = document.getElementById('dateInfo');
        const customDateInput = document.getElementById('customDate');
        const todayRadio = document.querySelector('input[name="mode"][value="today"]');
        const customRadio = document.querySelector('input[name="mode"][value="custom"]');
        const applyBtn = document.getElementById('applyDateBtn');
        const resetBtn = document.getElementById('resetTodayBtn');

        // текущий режим: 'today' или 'custom'
        let currentMode = 'today';
        // дата, которая сейчас отображается (объект Date)
        let displayDate = new Date(); // сегодня

        function updateDisplay() {
            const level = getSummerLevel(displayDate);
            const percent = Math.round(level * 100);
            // Обновляем полосу
            meterFill.style.width = percent + '%';
            meterFill.textContent = percent + '%';
            // Обновляем цифру
            valueLabel.innerHTML = percent + '<span>%</span>';

            // Формируем дату в удобном формате
            const dateStr = formatDate(displayDate);
            // Дополнительно покажем день недели (опционально)
            const weekdays = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const wd = weekdays[displayDate.getDay()];
            // индикатор режима
            let modeText = (currentMode === 'today') ? '📍 сегодня' : '📌 выбранная дата';
            dateInfo.textContent = `${dateStr} (${wd}) · ${modeText}`;

            // синхронизируем поле ввода даты, если режим custom — ставим значение
            if (currentMode === 'custom') {
                const year = displayDate.getFullYear();
                const month = String(displayDate.getMonth() + 1).padStart(2, '0');
                const day = String(displayDate.getDate()).padStart(2, '0');
                customDateInput.value = `${year}-${month}-${day}`;
            } else {
                // если сегодня, то поле ввода можно оставить как есть (не мешаем)
                // но при желании можно синхронизировать: не будем, чтобы не сбивать.
            }
        }

        // Установить дату отображения
        function setDisplayDate(dateObj, mode) {
            displayDate = new Date(dateObj);
            // очищаем время
            displayDate.setHours(0, 0, 0, 0);
            if (mode) {
                currentMode = mode;
                if (mode === 'today') {
                    todayRadio.checked = true;
                } else {
                    customRadio.checked = true;
                }
            }
            updateDisplay();
        }

        // ---------- Обработчики ----------
        // Переключение режимов (radio)
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', function(e) {
                if (this.value === 'today') {
                    currentMode = 'today';
                    // устанавливаем сегодняшнюю дату
                    const now = new Date();
                    setDisplayDate(now, 'today');
                } else {
                    currentMode = 'custom';
                    // берем дату из поля ввода
                    const val = customDateInput.value;
                    if (val) {
                        const parts = val.split('-');
                        const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                        if (!isNaN(d.getTime())) {
                            setDisplayDate(d, 'custom');
                        } else {
                            // если невалидная, ставим сегодня
                            const now = new Date();
                            setDisplayDate(now, 'custom');
                        }
                    } else {
                        // если пусто, ставим сегодня
                        const now = new Date();
                        setDisplayDate(now, 'custom');
                    }
                }
            });
        });

        // Кнопка "Показать" (применить выбранную дату)
        applyBtn.addEventListener('click', function() {
            const val = customDateInput.value;
            if (!val) {
                alert('Пожалуйста, выберите дату.');
                return;
            }
            const parts = val.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            if (isNaN(d.getTime())) {
                alert('Некорректная дата');
                return;
            }
            // переключаем в режим custom, если ещё не
            customRadio.checked = true;
            currentMode = 'custom';
            setDisplayDate(d, 'custom');
        });

        // Кнопка "Сегодня"
        resetBtn.addEventListener('click', function() {
            todayRadio.checked = true;
            currentMode = 'today';
            const now = new Date();
            setDisplayDate(now, 'today');
        });

        // Загрузка: по умолчанию показываем сегодня
        (function init() {
            const now = new Date();
            // устанавливаем сегодня, режим today
            todayRadio.checked = true;
            currentMode = 'today';
            displayDate = new Date(now);
            displayDate.setHours(0,0,0,0);
            // установим значение в поле ввода (для удобства)
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            customDateInput.value = `${y}-${m}-${d}`;
            updateDisplay();
        })();

        // Дополнительно: если пользователь вводит дату вручную и нажимает Enter (удобство)
        customDateInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                applyBtn.click();
            }
        });

    })();
</script>
</body>
</html>
